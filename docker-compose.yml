services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: hiresphere-server:latest
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api/v1
    image: hiresphere-client:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"
